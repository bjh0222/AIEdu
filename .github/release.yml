changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - feature
        - enhancement
    - title: 修复
      labels:
        - bug
        - fix
    - title: 文档与体验
      labels:
        - documentation
        - frontend
    - title: 维护
      labels:
        - maintenance
        - dependencies
    - title: 其他变更
      labels:
        - "*"
